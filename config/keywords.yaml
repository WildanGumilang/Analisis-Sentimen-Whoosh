# Keyword filter kandidat (Tahap 3). Recall diutamakan: salah tangkap boleh, terlewat jangan.
#
# Aturan pencocokan (lihat src/filter.py):
# - Dicocokkan pada text_original DAN text_translated setelah normalisasi ringan
#   (lowercase, huruf berulang dikompres: "macettt" -> "macet").
# - Keyword yang ada di _whole_word, dan keyword huruf Latin <= 4 karakter,
#   dicocokkan sebagai KATA UTUH (\b...\b). Contoh: "bus" tidak cocok dengan "business".
# - Keyword huruf non-Latin (Mandarin/Jepang/Korea/Arab) dicocokkan sebagai substring.
# - Kata "jam" sendirian SENGAJA tidak dipakai (bahasa Indonesia: waktu).
#
# v1 = daftar awal dari peneliti. v2 (2026-09-25) = tambahan dari review relevan yang terlewat
# saat eksplorasi filter, variasi ejaan, sinonim, dan istilah asing yang muncul di data.

