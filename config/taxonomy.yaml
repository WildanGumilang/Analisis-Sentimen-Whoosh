# Taksonomi aspek KONEKTIVITAS TRANSPORTASI menuju/dari Stasiun Whoosh Tegalluar.
# Kode aspek dipakai persis di semua tahap (filter, baseline, Label Studio, analisis).
# Definisi lengkap + contoh ada di config/guideline.md.

aspects:
  FEEDER_BUS: Bus feeder/shuttle resmi, DAMRI, Trans Metro Pasundan (TMP), Teman Bus, travel, halte bus
  PADALARANG: Opsi turun/naik di Padalarang, KA Feeder / kereta penghubung ke Stasiun Bandung
  OJOL: Ojek/mobil online (Gojek, Grab, Maxim, inDrive), titik jemput & drop-off ojol
  TAKSI: Taksi konvensional (Bluebird, dll.), argo, tarif taksi
  ANGKOT_OJEK_PANGKALAN: Angkot, angkutan umum informal, ojek pangkalan (opang), calo
  PARKIR: Parkir kendaraan pribadi (kapasitas, tarif, parkir inap, valet), antar-jemput pribadi
  AKSES_JALAN_MACET: Kemacetan & kondisi jalan menuju/dari stasiun, akses tol, putar balik
  JARAK_LOKASI: Lokasi stasiun jauh/dekat dari pusat kota atau tujuan
  INTEGRASI_JADWAL: Jadwal & jam operasional moda lanjutan, waktu tunggu, sinkronisasi dengan kereta, tiket terusan
  KONEKTIVITAS_UMUM: Penilaian umum akses/transportasi lanjutan tanpa moda spesifik ("susah pulangnya", "akses transportasinya kurang")

sentiments: [positive, negative, neutral, mixed]

